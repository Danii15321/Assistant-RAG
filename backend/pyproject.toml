[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated local PostgreSQL test database"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["app", "migrations"]


[[tool.mypy.overrides]]
module = ["torch", "sentence_transformers", "tokenizers"]
ignore_missing_imports = true
